# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# split panes using | and -
bind o split-window -h
bind k split-window -v
unbind '"'
unbind %

# switch windows (tabs) with prefix + arrow keys
bind Left previous-window
bind Right next-window

set-option -g default-shell /opt/homebrew/Cellar/fish/3.7.1/bin/fish
set -g default-terminal "xterm-256color"

# status/border colors live in the Oxocarbon theme block below
 
set-window-option -g mouse on
set -g @emulate-scroll-for-no-mouse-alternate-buffer "on"
set -g terminal-overrides 'xterm*:smcup@:rmcup@'
# ── Oxocarbon theme (colors only — bindings above untouched) ──
# Hex is downsampled to 256-color unless the terminal supports truecolor.
# For accurate color, if your terminal supports it, uncomment:
#   set -ga terminal-features ",xterm-256color:RGB"
set -g  status-style                 "bg=#161616,fg=#f2f4f8"
set -g  status-left                  "#[fg=#161616,bg=#be95ff,bold] #S #[fg=#be95ff,bg=#161616] "
set -g  status-left-length           30
set -g  status-right                 "#[fg=#be95ff]#H  #[fg=#33b1ff]%a %b %-d %-I:%M %p "
set -g  status-right-length          60
setw -g window-status-current-style  "fg=#33b1ff,bg=#262626,bold"
setw -g window-status-current-format " #I:#W "
setw -g window-status-style          "fg=#525252,bg=#161616"
setw -g window-status-format         " #I:#W "
set -g  pane-border-style            "fg=#393939"
set -g  pane-active-border-style     "fg=#33b1ff"
set -g  message-style                "bg=#262626,fg=#78a9ff"
set -g  message-command-style        "bg=#262626,fg=#33b1ff"
setw -g mode-style                   "bg=#78a9ff,fg=#161616"

run-shell ~/.config/tmux/tmux-better-mouse-mode/scroll_copy_mode.tmux
